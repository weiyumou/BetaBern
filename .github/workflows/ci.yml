name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        run: uv run --no-default-groups --group dev ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # torch is a core dependency, so the locked (CUDA) Linux build is pulled in here. It is
      # large but every test runs on CPU. If runner disk or time becomes a problem, pin the
      # CPU wheel index for torch in pyproject.toml ([tool.uv.sources]).
      - name: Install
        run: uv sync
      - name: Test
        run: uv run pytest
